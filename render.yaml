# Render Blueprint for QuantDinger
#
# Usage:
# 1. Render Dashboard -> New -> Blueprint -> select this fork.
# 2. During creation, set ADMIN_PASSWORD to a strong password.
# 3. Provide DATABASE_URL from an external PostgreSQL provider such as Neon or
#    Supabase. This Blueprint intentionally does not create Render PostgreSQL,
#    so it can avoid Render's payment-method requirement.
# 4. After the first deploy, verify the generated service URLs. If Render gives
#    different domains, update:
#      - backend env FRONTEND_URL
#      - frontend env BACKEND_URL
#
# Notes:
# - QuantDinger is a multi-service app. Render does not run docker-compose as a
#   single service, so this Blueprint deploys backend and frontend separately.
# - PostgreSQL is required by QuantDinger, but this file expects an external
#   DATABASE_URL instead of provisioning Render PostgreSQL.
# - Redis is intentionally disabled here. QuantDinger falls back to in-memory
#   cache when CACHE_ENABLED=false, which avoids a Render Key Value connection
#   string mismatch without changing upstream code.
# - Live trading is disabled by default. Enable it only after you understand the
#   trading and credential risks.

services:
  - type: web
    name: quantdinger-backend
    runtime: docker
    plan: free
    dockerContext: ./backend_api_python
    dockerfilePath: ./backend_api_python/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHON_API_HOST
        value: 0.0.0.0
      - key: PYTHON_API_PORT
        value: 10000
      - key: TZ
        value: Asia/Shanghai
      - key: DB_TYPE
        value: postgresql
      - key: DATABASE_URL
        sync: false
      - key: CACHE_ENABLED
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: quantdinger
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://quantdinger-frontend.onrender.com
      - key: OAUTH_ALLOWED_REDIRECTS
        value: ""
      - key: ENABLE_REGISTRATION
        value: "true"
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "8"
      - key: ALLOW_LOCAL_DESKTOP_BROKERS
        value: "false"
      - key: AGENT_LIVE_TRADING_ENABLED
        value: "false"
      - key: QUANTDINGER_DEPLOYMENT_MODE
        value: self-hosted

  - type: web
    name: quantdinger-frontend
    runtime: docker
    plan: free
    dockerContext: ./render-frontend
    dockerfilePath: ./render-frontend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BACKEND_URL
        value: https://quantdinger-backend.onrender.com
      - key: BACKEND_HOST
        value: quantdinger-backend.onrender.com
